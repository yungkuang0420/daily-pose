<!DOCTYPE html>
<html lang="ko" data-pose-date="2026-11-26">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 인증 포즈 · 2026년 11월 26일</title>
<meta name="theme-color" content="#e9f7f0">
<meta name="description" content="운동방 오늘의 인증 포즈 — 매일 아침 6시(KST)에 새로운 포즈로 업데이트됩니다.">
<style>
  :root{
    --mint:#2fbf9a;
    --mint-deep:#157d67;
    --mint-soft:#d8f3e9;
    --cream:#fdf8ec;
    --ink:#1c2b28;
    --ink-soft:#5c6f6a;
    --line:rgba(28,43,40,.08);
    --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 80% at 10% 0%, #f3fbf6 0%, rgba(243,251,246,0) 60%),
      radial-gradient(100% 70% at 100% 10%, #fdf6e6 0%, rgba(253,246,230,0) 55%),
      linear-gradient(170deg,#eaf8f2 0%,#f7fbf8 45%,#fdf9ee 100%);
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px 16px calc(28px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .card{
    width:100%;
    max-width:460px;
    background:var(--card);
    border-radius:26px;
    padding:26px 22px 22px;
    box-shadow:0 18px 44px rgba(21,125,103,.10), 0 2px 6px rgba(21,125,103,.06);
    border:1px solid rgba(255,255,255,.7);
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
  .brand{margin:0;font-size:15px;font-weight:800;letter-spacing:-.2px;color:var(--mint-deep)}
  .date{
    margin:0;font-size:12.5px;font-weight:600;color:var(--ink-soft);
    background:var(--mint-soft);border-radius:999px;padding:5px 11px;white-space:nowrap;
  }

  .badge{
    display:inline-block;font-size:12px;font-weight:800;letter-spacing:.2px;
    color:var(--mint-deep);background:linear-gradient(135deg,#e3f8ef,#d3f0ff);
    border:1px solid rgba(47,191,154,.22);border-radius:999px;padding:5px 12px;margin-bottom:10px;
  }
  h1{
    margin:0 0 16px;font-size:25px;line-height:1.28;font-weight:900;letter-spacing:-.6px;
  }
  h1 em{font-style:normal;color:var(--mint-deep)}

  figure{margin:0}
  .photo{
    position:relative;border-radius:20px;overflow:hidden;
    background:var(--cream);
    border:1px solid var(--line);
    box-shadow:0 10px 24px rgba(21,125,103,.10);
  }
  .photo img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}

  .desc{
    margin:18px 2px 0;font-size:15px;line-height:1.72;color:#2a3b37;letter-spacing:-.2px;
  }
  .desc b{color:var(--mint-deep);font-weight:800}
  /* 꼭 해야 하는 핵심 포인트 동작 — 빨간색 굵게 */
  .desc .pose-point{color:#dc2626;font-weight:800;letter-spacing:-.1px}

  .share{
    display:flex;align-items:center;justify-content:center;gap:7px;
    width:100%;margin-top:18px;padding:14px 16px;
    font:inherit;font-size:15px;font-weight:800;letter-spacing:-.3px;color:#fff;
    background:linear-gradient(135deg,var(--mint) 0%,#1ea7a0 100%);
    border:0;border-radius:15px;cursor:pointer;
    box-shadow:0 8px 18px rgba(47,191,154,.30);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .share:active{transform:scale(.98);box-shadow:0 4px 10px rgba(47,191,154,.28)}

  .next{
    margin:16px 0 0;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  }
  .next strong{color:var(--mint-deep);font-variant-numeric:tabular-nums;font-weight:800}

  footer{
    margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);
    text-align:center;font-size:12px;line-height:1.75;color:#6d827b;letter-spacing:-.1px;
  }

  .toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px);opacity:0;pointer-events:none;
    background:rgba(28,43,40,.92);color:#fff;font-size:13px;font-weight:700;
    padding:10px 16px;border-radius:12px;transition:opacity .22s ease, transform .22s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:360px){
    .card{padding:22px 16px 18px;border-radius:22px}
    h1{font-size:22px}
    .brand{font-size:14px}
    .date{font-size:11.5px;padding:4px 9px}
  }
  @media (prefers-color-scheme:dark){
    body{background:linear-gradient(170deg,#0e1b18 0%,#10231f 60%,#141d1a 100%)}
    .card{background:#16241f;border-color:rgba(255,255,255,.06);box-shadow:0 18px 44px rgba(0,0,0,.45)}
    h1{color:#eaf6f1}
    .desc{color:#d3e4de}
    .desc .pose-point{color:#ff6f6f}
    .date{background:rgba(47,191,154,.16)}
    footer{color:#7d9a92}
  }
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <p class="brand">🏋️ 오늘의 인증 포즈</p>
    <p class="date" id="poseDate">2026년 11월 26일 목요일</p>
  </div>

  <span class="badge" id="poseBadge">운동 × 밈</span>
  <h1 id="poseTitle">스쿼트 한 손 <em>브이(V)</em>!</h1>

  <figure class="photo">
    <img src="poses/2026-11-26.png?v=20261126b" alt="한 손으로 스마트폰을 들어 셀카를 찍으며 스쿼트 자세로 앉아, 남은 한 손으로 브이를 그리는 캐릭터" width="1000" height="1000" decoding="async">
  </figure>

  <p class="desc" id="poseDesc">
    한 손으로 폰을 들어 셀카 각도로 잡고, 발을 어깨너비보다 넓게 벌려 엉덩이를 뒤로 빼며 <strong class="pose-point">허벅지가 바닥과 평행</strong>이 될 때까지 앉아주세요.
    남은 한 손으로 <strong class="pose-point">브이(V)</strong>를 그려 <strong class="pose-point">10초</strong>만 버티면 오늘 인증 완료!
  </p>

  <button class="share" type="button" id="shareBtn">📤 운동방에 공유하기</button>

  <p class="next" id="next">다음 포즈까지 <strong>--:--:--</strong></p>

  <footer>
    매일 아침 6시(KST)에 새로운 포즈로 업데이트됩니다 · 최소 3개월간 중복 없음<br>
    모든 포즈는 한 손에 스마트폰을 들고 셀카를 찍는 상황 기준이에요
  </footer>
</main>
<div class="toast" id="toast">링크를 복사했어요</div>

<script>
(function () {
  /* 다음 6시(KST)까지 남은 시간 */
  var out = document.getElementById('next');
  function kst(d) { return new Date(d.getTime() + 9 * 3600 * 1000); }
  function tick() {
    var n = kst(new Date());
    var t = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate(), 6, 0, 0));
    if (t.getTime() <= n.getTime()) t.setUTCDate(t.getUTCDate() + 1);
    var s = Math.max(0, Math.floor((t - n) / 1000));
    var h = String(Math.floor(s / 3600)).padStart(2, '0');
    var m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
    var c = String(s % 60).padStart(2, '0');
    out.innerHTML = '다음 포즈까지 <strong>' + h + ':' + m + ':' + c + '</strong>';
  }
  tick(); setInterval(tick, 1000);

  /* 오늘 포즈 동기화 —
     GitHub Pages는 HTML을 최대 10분가량 캐시한다. 6시 직후에 옛 페이지가 떠도
     poses-history.json(캐시 무효화 쿼리)을 읽어 지금 시각의 포즈로 바로 바꿔준다. */
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function kstParts(d) {
    return new Date(d.getTime() + 9 * 3600 * 1000);
  }
  function kstISO(d) {
    var n = kstParts(d);
    return n.getUTCFullYear() + '-' + String(n.getUTCMonth() + 1).padStart(2, '0') + '-' + String(n.getUTCDate()).padStart(2, '0');
  }
  /* 설명 HTML 허용 범위 — <strong class="pose-point">(빨간 굵게)와 <b>만 통과시키고
     나머지는 전부 이스케이프한다. JSON의 description이 그대로 innerHTML로 들어가도 안전. */
  function escHTML(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function descHTML(s) {
    var MARK = { open: '\u0001', close: '\u0002', bOpen: '\u0003', bClose: '\u0004' };
    var t = String(s == null ? '' : s)
      .replace(/<strong\s+class\s*=\s*["']pose-point["']\s*>/gi, MARK.open)
      .replace(/<\/strong\s*>/gi, MARK.close)
      .replace(/<b\s*>/gi, MARK.bOpen)
      .replace(/<\/b\s*>/gi, MARK.bClose);
    return escHTML(t)
      .replace(/\u0001/g, '<strong class="pose-point">')
      .replace(/\u0002/g, '</strong>')
      .replace(/\u0003/g, '<b>')
      .replace(/\u0004/g, '</b>');
  }
  function imgSrc(p) {
    /* 같은 날짜에 이미지를 교체한 경우가 있으므로 image_v가 있으면 그 값을 캐시 키로 쓴다. */
    return p.image + '?v=' + (p.image_v || p.date.replace(/-/g, ''));
  }
  function render(p) {
    var ymd = p.date.split('-');
    var d = kstParts(new Date(Date.UTC(+ymd[0], +ymd[1] - 1, +ymd[2], 6, 0, 0)));
    document.getElementById('poseDate').textContent = ymd[0] + '년 ' + (+ymd[1]) + '월 ' + (+ymd[2]) + '일 ' + WD[d.getUTCDay()] + '요일';
    document.getElementById('poseBadge').textContent = p.category || '';
    var ttl = p.title || '';
    var escT = ttl.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
    document.getElementById('poseTitle').innerHTML = escT.replace(/\s(\S+)$/, ' <em>$1</em>');
    var img = document.querySelector('.photo img');
    img.src = imgSrc(p);
    img.alt = p.alt || p.title || '오늘의 인증 포즈';
    var desc = document.getElementById('poseDesc');
    desc.innerHTML = descHTML(p.description);
    desc.style.whiteSpace = 'pre-line';
    document.title = '오늘의 인증 포즈 · ' + ymd[0] + '년 ' + (+ymd[1]) + '월 ' + (+ymd[2]) + '일';
    document.documentElement.setAttribute('data-pose-date', p.date);
  }
  try {
    fetch('poses-history.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !Array.isArray(j.poses) || !j.poses.length) return;
        var today = kstISO(new Date());
        var past = j.poses.filter(function (p) { return p.date <= today; });
        var p = past[past.length - 1];
        if (!p) return;
        /* 날짜가 같아도 정적 스냅샷과 JSON 설명이 어긋나 있으면(캐시된 옛 페이지 등) 다시 그린다. */
        var norm = function (s) { return String(s || '').replace(/\s+/g, ' ').trim(); };
        if (
          p.date === document.documentElement.getAttribute('data-pose-date') &&
          norm(document.getElementById('poseTitle').textContent) === norm(p.title) &&
          norm(document.getElementById('poseDesc').innerHTML) === norm(descHTML(p.description)) &&
          document.querySelector('.photo img').getAttribute('src') === imgSrc(p)
        ) return;
        render(p);
      })
      .catch(function () {});
  } catch (e) {}

  /* 공유 */
  var btn = document.getElementById('shareBtn');
  var toast = document.getElementById('toast');
  function showToast(msg) {
    toast.textContent = msg; toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }
  btn.addEventListener('click', function () {
    var t = (document.getElementById('poseTitle').textContent || '오늘의 포즈').trim();
    var data = {
      title: '오늘의 인증 포즈',
      text: '오늘의 인증 포즈: ' + t + ' 🏋️',
      url: location.href.split('#')[0]
    };
    if (navigator.share) {
      navigator.share(data).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data.text + '\n' + data.url)
        .then(function () { showToast('운동방에 붙여넣을 수 있게 복사했어요'); })
        .catch(function () { showToast(data.url); });
    } else { showToast(data.url); }
  });
})();
</script>
</body>
</html>
